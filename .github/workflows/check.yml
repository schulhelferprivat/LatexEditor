name: Checks and native packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path bridge/Cargo.toml --check
      - run: cargo test --manifest-path bridge/Cargo.toml --locked
      - run: node scripts/rust-licenses.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: test-results/
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path bridge/Cargo.toml --locked
      - name: Install Windows packaging compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: npm run package
        env:
          LATEXHELPER_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v7
        with:
          name: LatexHelper-${{ matrix.os }}-unsigned
          path: |
            release/*.exe
            release/*.dmg
  release:
    needs: [check, native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: LatexHelper-*-unsigned
          merge-multiple: true
          path: release
      - run: ls -l release
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.dmg
          fail_on_unmatched_files: true
          body: |
            ## Installation

            1. Paket für die eigene Plattform herunterladen und installieren.
            2. LatexHelper im Browser öffnen und als App installieren.
            3. TeX bereitstellen: MiKTeX oder TeX Live unter Windows, MacTeX unter macOS.

            | Plattform | Datei |
            | --- | --- |
            | Windows x64 | `LatexHelper-Windows-x64-Setup.exe` |
            | macOS Apple Silicon | `LatexHelper-macOS-arm64.dmg` |
            | macOS Intel | `LatexHelper-macOS-x64.dmg` |

            Die Bridge startet danach automatisch bei der Anmeldung.

            ## Hinweis zu unsignierten Paketen

            Die Pakete sind nicht signiert. Deshalb warnen die Betriebssysteme beim ersten Start:

            - **Windows (SmartScreen):** „Weitere Informationen" und dann „Trotzdem ausführen".
            - **macOS (Gatekeeper):** Rechtsklick auf `Install-LatexHelper.command` und dann „Öffnen".
