name: Checks and native packages
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run version:check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path bridge/Cargo.toml --check
      - run: cargo test --manifest-path bridge/Cargo.toml --locked
      - run: node scripts/rust-licenses.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: test-results/
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bridge-windows-x64
            file: LatexHelper-Bridge-Windows.exe
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: bridge-macos-arm64
            file: LatexHelper-Bridge-macOS-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      LATEXHELPER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path bridge/Cargo.toml --locked --target ${{ matrix.target }}
      - run: npm run package
      - run: node scripts/verify-bridge.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          overwrite: true
          if-no-files-found: error
          path: |
            release/${{ matrix.file }}
            release/${{ matrix.file }}.sha256
